# Song categories. This file is the single source of truth for tags:
# the build validates every song against it, and the book lists tags and
# subtags in the order they appear here.
#
#   <tag_id>:
#     label: Text shown in the book
#     subtags:            # omit for a flat tag (songs use `<tag_id>: []`)
#       <subtag_id>: Text shown in the book
#     pill: Short text for the song's tag pill ("" hides it; default: the label).
#     A subtag takes it as   <subtag_id>: {label: Tercer ciclo, pill: III}

misa:
  label: Misa
  subtags:
    entrada: Entrada
    gloria: Gloria
    aleluya: Aleluya
    ofertorio: Ofertorio
    santo: Santo
    cordero: Cordero
    comunion: Comunion
    salida: Salida

alabanza:
  label: Alabanza
  subtags:
    primer_ciclo: {label: Primer ciclo, pill: I}
    segundo_ciclo: {label: Segundo ciclo, pill: II}
    tercer_ciclo: {label: Tercer ciclo, pill: III}
    cuarto_ciclo: {label: Cuarto ciclo, pill: IV}

adoracion:
  label: Adoracion

tema:
  label: Tema
  subtags:
    padre: Padre
    cristo: Cristo
    espiritu: Espiritu
    santo: Santo
    martir: Martir
    virgen: Virgen
